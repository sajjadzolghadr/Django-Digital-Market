{% extends 'myapp/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}

<h3>Change Password</h3>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Change Password
    </button>

    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
        Cancel
    </a>
</form>

{% endblock %}
