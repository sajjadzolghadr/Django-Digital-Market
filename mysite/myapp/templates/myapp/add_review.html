{% extends 'myapp/base.html' %}

{% block title %}Add Review{% endblock %}

{% block content %}

<h3>Review: {{ product.name }}</h3>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Submit Review
    </button>
</form>

{% endblock %}
