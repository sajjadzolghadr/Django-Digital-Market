{% extends 'myapp/base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}

<h3>My Profile</h3>

<p>
    <strong>Role:</strong> {{ role }}
</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Save Changes
    </button>
</form>

{% endblock %}
