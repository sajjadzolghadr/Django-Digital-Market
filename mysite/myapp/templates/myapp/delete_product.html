{% extends 'myapp/base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto">
  <div class="card card-shadow p-4 text-center">

    <div class="mb-3">
      <i class="fas fa-trash-alt text-danger" style="font-size: 50px;"></i>
    </div>

    <h3 class="mb-2">Delete Product</h3>

    <p class="text-muted">
      Are you sure you want to delete
      <strong>{{ product.name }}</strong>?
    </p>

    <p class="text-danger small">
      This action cannot be undone.
    </p>

    <form method="post" class="d-flex gap-2 justify-content-center">
      {% csrf_token %}

      <a href="{% url 'index' %}" class="btn btn-secondary px-4">
        Cancel
      </a>

      <button type="submit" class="btn btn-danger px-4">
        <i class="fas fa-trash me-1"></i>
        Delete
      </button>
    </form>

  </div>
</div>
{% endblock %}
