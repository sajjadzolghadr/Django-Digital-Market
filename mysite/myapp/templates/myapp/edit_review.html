{% extends 'myapp/base.html' %}

{% block title %}Edit Review{% endblock %}

{% block content %}

<h3>Edit Review</h3>

<div class="card p-4">
    <h5>{{ review.product.name }}</h5>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Update Review
        </button>

        <a href="{% url 'detail' review.product.id %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
