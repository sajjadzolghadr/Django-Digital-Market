{% extends 'myapp/base.html' %}
{% block content %}
<h3>My Purchases</h3>
{% for purchase in purchases %}
  <div class="card p-3 mb-2">
    <h5>{{ purchase.product.name }}</h5>
    <p>${{ purchase.product.price }}</p>
  </div>
{% empty %}
  <p>Your cart is empty.</p>
{% endfor %}

{% if purchases %}
<form method="post" action="{% url 'submit_order' %}">
  {% csrf_token %}
  <button class="btn btn-success">Submit Order</button>
</form>
{% endif %}

{% endblock %}
