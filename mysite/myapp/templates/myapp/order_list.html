{% extends 'myapp/base.html' %}
{% block title %}Orders{% endblock %}
{% block content %}
<h3>Orders</h3>
{% for order in orders %}
<div class="card p-3 mb-3">
    <h5>Customer: {{ order.customer }}</h5>
    <p>{{ order.created_at }}</p>
    <a href="{% url 'order_detail' order.id %}"
       class="btn btn-primary">
        Order Details
    </a>
</div>
{% empty %}
<p>No orders found.</p>
{% endfor %}
{% endblock %}
